name: SUBZERO-MD-DEPLOY
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Debug Environment
        run: |
          echo "=== ENVIRONMENT DEBUG ==="
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Working directory: $(pwd)"
          echo "Files in current directory:"
          ls -la
          
      - name: Install Dependencies
        run: |
          echo "=== INSTALLING DEPENDENCIES ==="
          npm install --verbose
          
      - name: Run Bot with Detailed Logging
        run: |
          echo "=== STARTING SUBZERO-MD BOT ==="
          echo "Timestamp: $(date)"
          
          timeout 18000 bash -c '
            attempt=1
            while true; do
              echo "=== ATTEMPT #$attempt ==="
              echo ">>> Starting bot attempt #$attempt at $(date)"
              npm start 2>&1 | while IFS= read -r line; do
                echo "[$(date +"%H:%M:%S")] $line"
              done
              exit_code=$?
              echo ">>> Bot stopped with exit code: $exit_code at $(date)"
              
              if [ $exit_code -eq 0 ]; then
                echo "Bot exited normally, restarting in 5 seconds..."
              else
                echo "Bot crashed, restarting in 10 seconds..."
              fi
              
              attempt=$((attempt + 1))
              sleep 10
            done
          ' || echo "Timeout reached after 5 hours"
          
      - name: Re-Trigger Workflow
        if: always()
        run: |
          echo "=== AUTO-RESTART ==="
          echo "Preparing to restart workflow at $(date)"
          sleep 30
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/SUBZERO-MD-DEPLOY.yml/dispatches \
            -d '{"ref":"subzero-z94uly"}'
          echo "Restart triggered successfully"